[project]
name = "grind-t-cbr-ratings"
version = "0.1.0"
description = "Async Python client for the Bank of Russia credit ratings registry"
readme = "README.md"
license = "ISC"
authors = [
    { name = "grind-t", email = "grindt.gd@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
]

[project.urls]
Homepage = "https://github.com/grind-t/cbr-ratings-py"
Issues = "https://github.com/grind-t/cbr-ratings-py/issues"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cbr_ratings"

# The official T-Invest SDK is not on PyPI.
[[tool.uv.index]]
name = "tbank"
url = "https://opensource.tbank.ru/api/v4/projects/238/packages/pypi/simple"
explicit = true

[tool.uv.sources]
t-tech-investments = { index = "tbank" }

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "SIM", "RUF", "PT", "N",
    "C4", "PIE", "PERF", "FURB", "PTH", "T20", "ANN", "ASYNC", "DTZ", "TID",
]
ignore = ["RUF001"]  # allow Cyrillic in strings

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pytest.mark.parametrize".msg = "Use the `subtests` fixture with named cases instead."

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"benchmarks/**" = ["ANN", "TID251"]  # benchmarks need parametrize: subtests are not timed separately
# Literal values copied verbatim from the ratings.cbr.ru search form.
"src/cbr_ratings/_core/search/search_form.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = ["error"]
asyncio_mode = "auto"
markers = ["e2e: hits the live ratings.cbr.ru API"]

[tool.poe.tasks]
fmt = "ruff format"
lint = [
    { cmd = "ruff check" },
    { cmd = "lint-imports" },
    { cmd = "lint-rules src" },
]
typecheck = "ty check"
test-unit = "pytest tests/core"
test-integration = "pytest tests/shell"
test = "pytest"
build = "uv build"
check = ["lint", "typecheck", "test-unit"]

[dependency-groups]
dev = [
    "brotli>=1.2.0",
    "grind-t-lint-rules>=0.2.0",
    "grind-t-moex>=0.1.0",
    "import-linter>=2.15",
    "poethepoet>=0.48.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "t-tech-investments>=1.51.0",
    "ty>=0.0.84",
]

# ---------- Architecture rules enforced by lint-imports ----------
[tool.importlinter]
root_package = "cbr_ratings"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Shell depends on core, never the reverse"
type = "layers"
layers = [
    "cbr_ratings._shell",
    "cbr_ratings._core",
]
